name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package is published as cross-platform, so it is verified on both.
        # ImageSharp decodes identically on each, and the golden dataset asserts
        # exact hash strings, which is where a platform difference would show up.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # One SDK per target framework. The .NET 11 SDK is still preview; when it
      # is unavailable the job fails loudly rather than quietly building fewer
      # targets than the published package claims.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore PerceptualHash.NET.sln

      - name: Build
        run: dotnet build PerceptualHash.NET.sln -c Release --no-restore

      # Runs the suite once per target framework: net8.0, net10.0, net11.0.
      - name: Test
        run: >
          dotnet test PerceptualHash.NET.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          retention-days: 7

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds commit information, which needs real history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      # Proves the package builds on every push, so a packaging problem is not
      # discovered for the first time while cutting a release.
      - name: Pack
        run: dotnet pack src/NetImgHash/NetImgHash.csproj -c Release -o ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.*nupkg
          retention-days: 7
