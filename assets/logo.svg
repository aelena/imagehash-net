<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title id="title">PerceptualHash.NET</title>
  <desc id="desc">An 8 by 8 grid of hash bits. The set bits draw two mountains under a sun: the image is the hash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#4A22C9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- unset bits: the 8x8 grid, 12px cells on a 14px pitch, 9px margin -->
  <g fill="#FFFFFF" fill-opacity="0.14">
    <rect x="9"   y="9"  width="12" height="12" rx="2.5"/><rect x="23" y="9"  width="12" height="12" rx="2.5"/><rect x="37" y="9"  width="12" height="12" rx="2.5"/><rect x="51" y="9"  width="12" height="12" rx="2.5"/><rect x="65" y="9"  width="12" height="12" rx="2.5"/><rect x="79" y="9"  width="12" height="12" rx="2.5"/><rect x="93" y="9"  width="12" height="12" rx="2.5"/><rect x="107" y="9"  width="12" height="12" rx="2.5"/>
    <rect x="9"   y="23" width="12" height="12" rx="2.5"/><rect x="23" y="23" width="12" height="12" rx="2.5"/><rect x="37" y="23" width="12" height="12" rx="2.5"/><rect x="51" y="23" width="12" height="12" rx="2.5"/><rect x="65" y="23" width="12" height="12" rx="2.5"/><rect x="79" y="23" width="12" height="12" rx="2.5"/><rect x="107" y="23" width="12" height="12" rx="2.5"/>
    <rect x="9"   y="37" width="12" height="12" rx="2.5"/><rect x="23" y="37" width="12" height="12" rx="2.5"/><rect x="37" y="37" width="12" height="12" rx="2.5"/><rect x="51" y="37" width="12" height="12" rx="2.5"/><rect x="65" y="37" width="12" height="12" rx="2.5"/><rect x="79" y="37" width="12" height="12" rx="2.5"/><rect x="93" y="37" width="12" height="12" rx="2.5"/><rect x="107" y="37" width="12" height="12" rx="2.5"/>
    <rect x="9"   y="51" width="12" height="12" rx="2.5"/><rect x="23" y="51" width="12" height="12" rx="2.5"/><rect x="51" y="51" width="12" height="12" rx="2.5"/><rect x="65" y="51" width="12" height="12" rx="2.5"/><rect x="79" y="51" width="12" height="12" rx="2.5"/><rect x="93" y="51" width="12" height="12" rx="2.5"/><rect x="107" y="51" width="12" height="12" rx="2.5"/>
    <rect x="9"   y="65" width="12" height="12" rx="2.5"/><rect x="65" y="65" width="12" height="12" rx="2.5"/><rect x="93" y="65" width="12" height="12" rx="2.5"/><rect x="107" y="65" width="12" height="12" rx="2.5"/>
    <rect x="107" y="79" width="12" height="12" rx="2.5"/>
  </g>

  <!-- set bits: two peaks and the ground -->
  <g fill="#FFFFFF">
    <rect x="37" y="51" width="12" height="12" rx="2.5"/>
    <rect x="23" y="65" width="12" height="12" rx="2.5"/><rect x="37" y="65" width="12" height="12" rx="2.5"/><rect x="51" y="65" width="12" height="12" rx="2.5"/><rect x="79" y="65" width="12" height="12" rx="2.5"/>
    <rect x="9"  y="79" width="12" height="12" rx="2.5"/><rect x="23" y="79" width="12" height="12" rx="2.5"/><rect x="37" y="79" width="12" height="12" rx="2.5"/><rect x="51" y="79" width="12" height="12" rx="2.5"/><rect x="65" y="79" width="12" height="12" rx="2.5"/><rect x="79" y="79" width="12" height="12" rx="2.5"/><rect x="93" y="79" width="12" height="12" rx="2.5"/>
    <rect x="9"  y="93" width="12" height="12" rx="2.5"/><rect x="23" y="93" width="12" height="12" rx="2.5"/><rect x="37" y="93" width="12" height="12" rx="2.5"/><rect x="51" y="93" width="12" height="12" rx="2.5"/><rect x="65" y="93" width="12" height="12" rx="2.5"/><rect x="79" y="93" width="12" height="12" rx="2.5"/><rect x="93" y="93" width="12" height="12" rx="2.5"/><rect x="107" y="93" width="12" height="12" rx="2.5"/>
    <rect x="9"  y="107" width="12" height="12" rx="2.5"/><rect x="23" y="107" width="12" height="12" rx="2.5"/><rect x="37" y="107" width="12" height="12" rx="2.5"/><rect x="51" y="107" width="12" height="12" rx="2.5"/><rect x="65" y="107" width="12" height="12" rx="2.5"/><rect x="79" y="107" width="12" height="12" rx="2.5"/><rect x="93" y="107" width="12" height="12" rx="2.5"/><rect x="107" y="107" width="12" height="12" rx="2.5"/>
  </g>

  <!-- the sun: the one bit that is not a square -->
  <circle cx="99" cy="29" r="6.5" fill="#FFB020"/>
</svg>
